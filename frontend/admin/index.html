<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagoo's - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== STYLES ADMIN ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F8F9FA; }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: #1A5276;
            color: white;
            padding: 24px;
            overflow-y: auto;
        }
        .sidebar .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }
        .sidebar .logo .logo-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #F1C40F;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #1A5276;
        }
        .sidebar .logo h1 { font-size: 20px; font-weight: 700; }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: 0.3s;
            margin-bottom: 4px;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .nav-item i { width: 20px; }
        
        /* Main content */
        .main-content {
            margin-left: 260px;
            padding: 32px;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .dashboard-header h2 { font-size: 28px; color: #1A5276; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-card .number { font-size: 32px; font-weight: 800; color: #1A5276; }
        .stat-card .label { color: #6C757D; font-size: 14px; margin-top: 4px; }
        
        .table-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 16px; background: #F8F9FA; font-weight: 600; color: #1A5276; }
        td { padding: 12px 16px; border-bottom: 1px solid #E9ECEF; }
        .badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-super_admin { background: #E74C3C; color: white; }
        .badge-admin { background: #1A5276; color: white; }
        .badge-driver { background: #F1C40F; color: #1A1A2E; }
        .badge-cooperative { background: #27AE60; color: white; }
        
        .logout-btn {
            position: absolute;
            bottom: 24px;
            left: 24px;
            color: rgba(255,255,255,0.6);
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .logout-btn:hover { color: #E74C3C; }
        
        @media (max-width: 768px) {
            .sidebar { width: 200px; }
            .main-content { margin-left: 200px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-placeholder">D</div>
            <h1>DAGOO'S</h1>
        </div>
        <nav>
            <a href="#" class="nav-item active"><i class="fas fa-home"></i> Tableau de bord</a>
            <a href="#" class="nav-item"><i class="fas fa-users"></i> Utilisateurs</a>
            <a href="#" class="nav-item"><i class="fas fa-car"></i> Flottes</a>
            <a href="#" class="nav-item"><i class="fas fa-truck"></i> Courses</a>
            <a href="#" class="nav-item"><i class="fas fa-credit-card"></i> Paiements</a>
        </nav>
        <button class="logout-btn" id="logoutBtn" style="display: none;">
            <i class="fas fa-sign-out-alt"></i> 🚪 Déconnexion
        </button>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content">
        <div class="dashboard-header">
            <h2><i class="fas fa-chart-line" style="color:#F1C40F;"></i> Tableau de bord</h2>
            <span id="userInfo" style="color:#6C757D; font-size:14px;"></span>
        </div>
        
        <!-- Statistiques -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">👥 Utilisateurs</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalDrivers">0</div>
                <div class="label">🚗 Chauffeurs</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalTrips">0</div>
                <div class="label">📍 Courses</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalRevenue">0</div>
                <div class="label">💰 Revenus</div>
            </div>
        </div>

        <!-- Tableau des utilisateurs -->
        <div class="table-container">
            <h3 style="margin-bottom:16px; color:#1A5276;"><i class="fas fa-users"></i> Derniers utilisateurs</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" style="text-align:center; color:#6C757D;">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
