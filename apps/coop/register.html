<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagoo's Coop - Inscription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #27AE60 0%, #1E8449 50%, #145A32 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .register-container {
            background: white; border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .register-header { text-align: center; margin-bottom: 36px; }
        .register-logo {
            width: 64px; height: 64px; background: #F1C40F; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px; font-size: 32px;
        }
        .register-header h1 { font-size: 24px; color: #1A1A2E; margin-bottom: 4px; }
        .register-header p { color: #6C757D; font-size: 14px; }
        .badge {
            display: inline-block; background: #27AE60; color: white;
            padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; margin-top: 8px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #1A1A2E; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 14px; border: 2px solid #E9ECEF;
            border-radius: 8px; font-size: 15px; font-family: 'Inter', sans-serif; transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #27AE60; }
        .btn-register {
            width: 100%; padding: 14px; background: #27AE60; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: background 0.3s; font-family: 'Inter', sans-serif;
        }
        .btn-register:hover { background: #1E8449; }
        .btn-register:disabled { background: #6C757D; cursor: not-allowed; }
        .message {
            text-align: center; margin-top: 16px; padding: 10px; border-radius: 8px;
            font-size: 14px; display: none;
        }
        .message.error { background: #FDE8E8; color: #C0392B; display: block; }
        .message.success { background: #D5F5E3; color: #27AE60; display: block; }
        .message.info { background: #D6EAF8; color: #1A5276; display: block; }
        .links { text-align: center; margin-top: 24px; }
        .links a { color: #6C757D; text-decoration: none; font-size: 14px; }
        .links a:hover { color: #27AE60; }
        .links span { color: #6C757D; margin: 0 8px; }
        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="register-logo">🏢</div>
            <h1>Créer un compte Coopérative</h1>
            <p>Gérez votre coopérative de transport</p>
            <span class="badge">🆓 Gratuit</span>
        </div>
        
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Nom de la coopérative</label>
                    <input type="text" id="name" placeholder="Nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="exemple@email.com" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" placeholder="034 00 000 00" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="Min 6 caractères" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmer</label>
                    <input type="password" id="confirmPassword" placeholder="Répéter le mot de passe" required>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn-register" id="registerBtn">
                <i class="fas fa-user-plus"></i> Créer mon compte
            </button>
        </form>
        
        <div class="links">
            <a href="index.html">Déjà un compte ? Se connecter</a>
            <span>|</span>
            <a href="https://dago-mobility.pages.dev">← Accueil</a>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
