<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }
        .hero { background: linear-gradient(135deg, #27AE60, #154360); color: white; padding: 80px 20px; text-align: center; }
        .hero h1 { font-size: 36px; margin-bottom: 10px; }
        .hero p { font-size: 18px; opacity: 0.9; }
        .section { padding: 60px 20px; max-width: 900px; margin: 0 auto; }
        .section h2 { font-size: 28px; color: #27AE60; margin-bottom: 10px; }
        .section p { color: #6C757D; line-height: 1.6; }
        .section:nth-child(even) { background: #F8F9FA; }
        footer { background: #1A1A2E; color: white; text-align: center; padding: 30px; }
        footer a { color: #F1C40F; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        var slug = window.location.pathname.replace('/', '').replace('.html', '');
        if (!slug) slug = 'flotte-alasora';
        
        fetch('https://dagoos-api.onrender.com/api/landing-content')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var myContent = data.filter(function(c) { return c.section && c.section.endsWith('-' + slug); });
                var getContent = function(key) {
                    var found = myContent.find(function(c) { return c.section === key + '-' + slug; });
                    return found || { title: 'Dago Fleet', subtitle: 'Service de transport' };
                };
                var hero = getContent('hero');
                var apps = getContent('apps');
                var features = getContent('features');
                var about = getContent('about');
                var cta = getContent('cta');
                var footer = getContent('footer');
                
                var html = '';
                html += '<div class="hero"><h1>' + hero.title + '</h1><p>' + (hero.subtitle || '') + '</p></div>';
                html += '<div class="section"><h2>' + apps.title + '</h2><p>' + (apps.subtitle || '') + '</p></div>';
                html += '<div class="section"><h2>' + features.title + '</h2><p>' + (features.subtitle || '') + '</p></div>';
                html += '<div class="section"><h2>' + about.title + '</h2><p>' + (about.subtitle || '') + '</p></div>';
                html += '<div class="section"><h2>' + cta.title + '</h2><p>' + (cta.subtitle || '') + '</p></div>';
                html += '<footer><p>' + (footer.title || '') + '</p><p>' + (footer.subtitle || '') + '</p><a href="https://dago-coop.pages.dev">Se connecter</a></footer>';
                
                document.getElementById('app').innerHTML = html;
                document.title = hero.title + ' - Dago Fleet';
            })
            .catch(function() {
                document.getElementById('app').innerHTML = '<div class="hero"><h1>Page non disponible</h1></div>';
            });
    </script>
</body>
</html>
