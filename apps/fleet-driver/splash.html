<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dago Driver - Flotte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: pulse 2s infinite;
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .splash-subtitle {
      font-size: 15px;
      opacity: 0.8;
      font-weight: 400;
    }
    .spinner {
      margin-top: 36px;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top: 4px solid #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="/icons/icon-192.png" alt="Dago Driver" class="splash-logo" id="logo">
    <div class="splash-title">Dago Driver</div>
    <div class="splash-subtitle">Gestion de flotte urbaine</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Remplacer par le logo de la flotte si disponible en localStorage
    const savedLogo = localStorage.getItem('dagoos_logo_fleet');
    if (savedLogo) {
      document.getElementById('logo').src = savedLogo;
    }
    // Rediriger après chargement
    setTimeout(() => {
      window.location.href = '/index.html';
    }, 2500);
  </script>
</body>
</html>
