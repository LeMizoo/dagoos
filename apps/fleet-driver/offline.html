<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A2E">
    <title>Dagoo's Driver - Hors ligne</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #1A1A2E;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .offline-card {
            background: #1E293B;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            border: 1px solid rgba(241,196,15,0.2);
        }
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #F1C40F;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .retry-btn {
            background: #F1C40F;
            color: #1A1A2E;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .retry-btn:hover {
            background: #DAA520;
            transform: translateY(-2px);
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/icons/icon-192.png" alt="Dagoo's" class="logo">
        <div class="offline-icon">📡</div>
        <h1>Mode hors ligne</h1>
        <p>Vous n'êtes pas connecté à Internet. Les données s'afficheront automatiquement dès que la connexion sera rétablie.</p>
        <button class="retry-btn" onclick="location.reload()">
            🔄 Réessayer
        </button>
    </div>
    
    <script>
        // Vérifier périodiquement la connexion
        setInterval(() => {
            if (navigator.onLine) {
                location.reload();
            }
        }, 5000);
    </script>
</body>
</html>
