<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Apple PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dagoo's Driver">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Dagoo's Driver - Connexion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F7F8FA">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js")
                .then(reg => console.log("SW enregistré !", reg))
                .catch(err => console.error("Erreur SW:", err));
        }
    </script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo"><i class="fas fa-motorcycle"></i></div>
            <h1>Dagoo's Driver</h1>
            <p>Espace Chauffeur</p>
            <span class="badge">Application mobile - Flotte</span>
        </div>
        
        <div class="note">
            <i class="fas fa-info-circle"></i> 
            Votre compte est créé par votre gestionnaire de flotte ou coopérative.
        </div>
        
        <script>
            var selectedType = 'FLEET';
            // Auto-focus amélioré pour les inputs PIN
            document.addEventListener('DOMContentLoaded', function() {
                var pinInputs = document.querySelectorAll('#pinInputs input');
                pinInputs.forEach(function(input, index) {
                    // Gérer la saisie
                    input.addEventListener('input', function(e) {
                        if (input.value.length === 1 && index < pinInputs.length - 1) {
                            pinInputs[index + 1].focus();
                        }
                    });
                    
                    // Gérer le backspace
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                            pinInputs[index - 1].focus();
                        }
                    });
                    
                    // Gérer le collage
                    input.addEventListener('paste', function(e) {
                        e.preventDefault();
                        var pastedText = (e.clipboardData || window.clipboardData).getData('text');
                        var digits = pastedText.replace(/\D/g, '').slice(0, 4);
                        for (var i = 0; i < digits.length; i++) {
                            if (pinInputs[i]) {
                                pinInputs[i].value = digits[i];
                            }
                        }
                        if (digits.length < 4) {
                            pinInputs[digits.length].focus();
                        }
                    });
                });
            });

            // Auto-focus amélioré pour les inputs PIN
            document.addEventListener('DOMContentLoaded', function() {
                var pinInputs = document.querySelectorAll('#pinInputs input');
                pinInputs.forEach(function(input, index) {
                    // Gérer la saisie
                    input.addEventListener('input', function(e) {
                        if (input.value.length === 1 && index < pinInputs.length - 1) {
                            pinInputs[index + 1].focus();
                        }
                    });
                    
                    // Gérer le backspace
                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                            pinInputs[index - 1].focus();
                        }
                    });
                    
                    // Gérer le collage
                    input.addEventListener('paste', function(e) {
                        e.preventDefault();
                        var pastedText = (e.clipboardData || window.clipboardData).getData('text');
                        var digits = pastedText.replace(/\D/g, '').slice(0, 4);
                        for (var i = 0; i < digits.length; i++) {
                            if (pinInputs[i]) {
                                pinInputs[i].value = digits[i];
                            }
                        }
                        if (digits.length < 4) {
                            pinInputs[digits.length].focus();
                        }
                    });
                });
            });

            function selectDriverType(type) {
                selectedType = type;
                var btnFleet = document.getElementById('btnFleet');
                var btnCoop = document.getElementById('btnCoop');
                
                if (type === 'FLEET') {
                    btnFleet.style.background = 'var(--accent)';
                    btnFleet.style.color = 'var(--text-on-accent)';
                    btnCoop.style.background = 'var(--bg-soft)';
                    btnCoop.style.color = 'var(--accent)';
                } else {
                    btnCoop.style.background = 'var(--accent)';
                    btnCoop.style.color = 'var(--text-on-accent)';
                    btnFleet.style.background = 'var(--bg-soft)';
                    btnFleet.style.color = 'var(--accent)';
                }
                
                localStorage.setItem('dagoo_driver_type', type);
            }
        </script>

        <!-- Type fixe : FLEET -->
        <div style="display:flex;gap:10px;margin-bottom:16px;" id="driverTypeSelector">
            <button type="button" style="display:none;" id="btnFleet" 
                style="flex:1;padding:12px;background:var(--bg-soft);border:2px solid var(--accent);border-radius:10px;color:var(--accent);font-weight:700;cursor:pointer;">
                🚛 Fleet
            </button>
            <button type="button" style="display:none;" id="btnCoop" 
                style="flex:1;padding:12px;background:var(--bg-soft);border:2px solid var(--accent);border-radius:10px;color:var(--accent);font-weight:700;cursor:pointer;">
                🏢 Coop
            </button>
        </div>

        <form id="loginForm">
            
            <div class="form-group" id="codeSection">
                <label>🔑 Votre code chauffeur</label>
                <input type="text" id="driverCode" placeholder="Ex: FL-AL-001" required autocomplete="off" style="text-transform: uppercase; width: 100%; padding: 12px; font-size: 16px; text-align: center; letter-spacing: 2px; background: var(--bg-surface); border: 2px solid var(--accent); border-radius: 10px; color: var(--text-primary);">
                <div class="code-hint" id="codeHint" style="font-size: 11px; color: var(--text-muted); margin-top: 5px; text-align: center;">Code fourni par votre flotte</div>
            </div>
            <div class="form-group" id="savedCodeSection" style="display:none;">
                <label>🚛 Chauffeur</label>
                <div style="background:var(--bg-soft);border:2px solid var(--accent);border-radius:10px;padding:12px;text-align:center;">
                    <span id="savedCodeDisplay" style="color:var(--accent);font-size:16px;font-weight:700;letter-spacing:2px;"></span>
                    <button type="button" onclick="showCodeInput()" style="background:none;border:none;color:var(--text-muted);font-size:11px;cursor:pointer;text-decoration:underline;margin-left:8px;">Changer</button>
                </div>
            </div>
            
            <!-- PIN -->
            <div class="form-group">
                <label><i class="fas fa-lock"></i> PIN (4 chiffres)</label>
                <div class="pin-row" id="pinInputs">
                    <input type="tel" maxlength="1" pattern="[0-9]" inputmode="numeric" placeholder="•">
                    <input type="tel" maxlength="1" pattern="[0-9]" inputmode="numeric" placeholder="•">
                    <input type="tel" maxlength="1" pattern="[0-9]" inputmode="numeric" placeholder="•">
                    <input type="tel" maxlength="1" pattern="[0-9]" inputmode="numeric" placeholder="•">
                </div>
            </div>
            
            <div id="message" class="message"></div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>
        </form>
        
        <div class="links">
            <a href="#" onclick="location.reload()" title="Actualiser" style="font-size:18px;"><i class="fas fa-sync-alt"></i></a>
        </div>
    </div>
    <script src="js/login.js?v=2"></script>
  <script src="/js/inactivity.js"></script>
</body>
</html>
