<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAGOO'S — Transport à Madagascar</title>

  <style>
    :root {
      --splash-bg: #16213e;
      --splash-fg: #FFFFFF;
      --splash-accent: #E0A01C;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body.splash-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--splash-bg);
      color: var(--splash-fg);
      font-family: system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: pulse 2s infinite;
    }

    .splash-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .splash-subtitle {
      font-size: 15px;
      opacity: 0.8;
      font-weight: 400;
    }

    .spinner {
      margin-top: 36px;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top: 4px solid var(--splash-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="splash-page">
  <div class="splash-container">
    <img
      src="/icons/splash-logo.png"
      alt="DAGOO'S"
      class="splash-logo"
      id="logo"
    >
    <div class="splash-title">DAGOO'S</div>
    <div class="splash-subtitle">Votre transport à Madagascar</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Vérifier si l'API est accessible avant de rediriger
    async function checkApiAndRedirect() {
      const API_URL = 'https://dagoos-api.onrender.com/api';

      const MIN_SPLASH_TIME = 2500;
      const MAX_SPLASH_TIME = 8000;

      const startTime = Date.now();

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        await fetch(`${API_URL}/health`, {
          signal: controller.signal,
          cache: 'no-store'
        });

        clearTimeout(timeoutId);
      } catch (error) {
        console.log('API inaccessible, attente...');
      }

      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);

      setTimeout(() => {
        window.location.replace('/index.html');
      }, Math.min(remaining, MAX_SPLASH_TIME));
    }

    checkApiAndRedirect();
  </script>
</body>
</html>
