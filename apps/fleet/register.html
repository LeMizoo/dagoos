<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dago Fleet - Inscription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-container { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 25px 80px rgba(0,0,0,0.4); }
        .register-header { text-align: center; margin-bottom: 28px; }
        .register-logo { width: 64px; height: 64px; margin: 0 auto 12px; background: linear-gradient(135deg, #F1C40F, #F39C12); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; }
        .register-header h1 { font-size: 22px; color: #1A1A2E; margin-bottom: 4px; }
        .register-header p { color: #6C757D; font-size: 14px; }
        .badge { display: inline-block; background: #27AE60; color: white; padding: 5px 12px; border-radius: 50px; font-size: 12px; font-weight: 600; margin-top: 8px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #1A1A2E; margin-bottom: 4px; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 12px 40px 12px 12px; border: 2px solid #E9ECEF; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: 0.3s; }
        .input-wrapper input:focus { outline: none; border-color: #1A5276; }
        .input-wrapper .toggle-pwd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6C757D; }
        .btn-register { width: 100%; padding: 14px; background: #1A5276; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: 'Inter', sans-serif; }
        .btn-register:hover { background: #154360; }
        .message { text-align: center; margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        .message.error { background: #FDE8E8; color: #C0392B; display: block; }
        .message.success { background: #D5F5E3; color: #27AE60; display: block; }
        .message.info { background: #D6EAF8; color: #1A5276; display: block; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #6C757D; text-decoration: none; font-size: 13px; }
        .links a:hover { color: #1A5276; }
        .links span { color: #6C757D; margin: 0 8px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="register-logo"><i class="fas fa-truck"></i></div>
            <h1>Créer un compte Flotte</h1>
            <p>Gérez vos véhicules et chauffeurs</p>
            <span class="badge">🆓 Gratuit</span>
        </div>
        <!-- Sélection du plan -->
        <div class="plan-section" style="margin-bottom:24px;">
            <h3 style="font-size:15px;color:#1A1A2E;margin-bottom:4px;text-align:center;">📦 Choisissez votre plan</h3>
            <p style="font-size:12px;color:#6C757D;margin-bottom:14px;text-align:center;">Évoluez selon vos besoins</p>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
                <label class="plan-option">
                    <input type="radio" name="plan" value="Freemium" checked style="display:none;">
                    <div style="border:2px solid #E9ECEF;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:0.2s;">
                        <div style="font-size:11px;font-weight:700;color:#1A1A2E;">🆓 Freemium</div>
                        <div style="font-size:10px;color:#6C757D;">5 véhicules</div>
                        <div style="font-size:13px;font-weight:700;color:#1A5276;">Gratuit</div>
                    </div>
                </label>
                <label class="plan-option">
                    <input type="radio" name="plan" value="Basic" style="display:none;">
                    <div style="border:2px solid #E9ECEF;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:0.2s;">
                        <div style="font-size:11px;font-weight:700;color:#1A1A2E;">🚗 Basic</div>
                        <div style="font-size:10px;color:#6C757D;">10 véhicules</div>
                        <div style="font-size:13px;font-weight:700;color:#1A5276;">29 000 Ar</div>
                    </div>
                </label>
                <label class="plan-option">
                    <input type="radio" name="plan" value="Standard" style="display:none;">
                    <div style="border:2px solid #E9ECEF;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:0.2s;">
                        <div style="font-size:11px;font-weight:700;color:#1A1A2E;">🚙 Standard</div>
                        <div style="font-size:10px;color:#6C757D;">30 véhicules</div>
                        <div style="font-size:13px;font-weight:700;color:#1A5276;">49 000 Ar</div>
                    </div>
                </label>
                <label class="plan-option">
                    <input type="radio" name="plan" value="Premium" style="display:none;">
                    <div style="border:2px solid #E9ECEF;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:0.2s;">
                        <div style="font-size:11px;font-weight:700;color:#1A1A2E;">👑 Premium</div>
                        <div style="font-size:10px;color:#6C757D;">Illimité</div>
                        <div style="font-size:13px;font-weight:700;color:#1A5276;">99 000 Ar</div>
                    </div>
                </label>
            </div>
        </div>
        <style>
            .plan-option input:checked + div {
                border-color: #1A5276 !important;
                background: #EBF5FB;
            }
        </style>
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group"><label>Nom complet</label><input type="text" id="name" placeholder="Votre nom" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="exemple@email.com" required></div>
            </div>
            <div class="form-group"><label>Téléphone</label><input type="tel" id="phone" placeholder="034 00 000 00" required></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Mot de passe</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Min 6 caractères" required minlength="6">
                        <i class="fas fa-eye toggle-pwd" onclick="togglePassword('password', this)"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirmer</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Répéter" required>
                        <i class="fas fa-eye toggle-pwd" onclick="togglePassword('confirmPassword', this)"></i>
                    </div>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> Créer mon compte</button>
        </form>
        <div class="links">
            <a href="index.html">Déjà un compte ? Se connecter</a>
            <span>|</span>
            <a href="https://dago-mobility.pages.dev">← Accueil</a>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
