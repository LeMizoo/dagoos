<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagoo's Flotte - Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1A5276, #154360); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .header { text-align: center; margin-bottom: 28px; }
        .header .icon { font-size: 40px; margin-bottom: 8px; }
        .header h1 { font-size: 20px; color: #1A1A2E; }
        .header p { color: #6C757D; font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #1A1A2E; }
        .input-wrap { position: relative; }
        .input-wrap input { width: 100%; padding: 12px 40px 12px 12px; border: 2px solid #E9ECEF; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; }
        .input-wrap input:focus { outline: none; border-color: #1A5276; }
        .input-wrap .toggle-pwd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6C757D; }
        .btn { width: 100%; padding: 14px; background: #1A5276; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn:hover { background: #154360; }
        .message { text-align: center; margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        .message.error { background: #FDE8E8; color: #C0392B; display: block; }
        .message.success { background: #D5F5E3; color: #27AE60; display: block; }
        .message.info { background: #D6EAF8; color: #1A5276; display: block; }
        .links { text-align: center; margin-top: 16px; font-size: 13px; }
        .links a { color: #1A5276; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🚛</div>
            <h1>Dagoo's Flotte</h1>
            <p>Espace Gestionnaire de Flotte</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Votre mot de passe" required>
                    <i class="fas fa-eye toggle-pwd" onclick="togglePassword('password', this)"></i>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Se connecter</button>
        </form>
        <div class="links">
            <a href="register.html">Créer un compte</a>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
