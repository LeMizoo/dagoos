<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dago Fleet - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img id="sidebarLogo" src="https://dago-mobility.pages.dev/assets/logo/b-trans.png" alt="Logo">
            <h2 id="sidebarFleetName">FLEET <span>DAGO</span></h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="active" data-page="home"><i class="fas fa-chart-pie"></i> Vue d'ensemble</a>
            <a href="#" data-page="vehicles"><i class="fas fa-motorcycle"></i> Véhicules <span class="badge" id="vehicleCount">0</span></a>
            <a href="#" data-page="fiche_vehicule"><i class="fas fa-file-alt"></i> Fiche Véhicule</a>
            <a href="#" data-page="proprietaires"><i class="fas fa-building"></i> Propriétaires <span class="badge" id="propCount">0</span></a>
            <a href="#" data-page="drivers"><i class="fas fa-users"></i> Chauffeurs <span class="badge" id="driverCount">0</span></a>
            <a href="#" data-page="fiche_chauffeur"><i class="fas fa-id-card"></i> Fiche Chauffeur</a>
            <a href="#" data-page="codes"><i class="fas fa-key"></i> Codes Chauffeurs</a>
            <a href="#" data-page="permutation"><i class="fas fa-exchange-alt"></i> Permutation Véhicule</a>
            <div class="nav-section">💰 Finances</div>
            <a href="#" data-page="finances"><i class="fas fa-coins"></i> Finances</a>
            <a href="#" data-page="depenses"><i class="fas fa-receipt"></i> Dépenses</a>
            <a href="#" data-page="versements"><i class="fas fa-hand-holding-usd"></i> Versements</a>
            <div class="nav-section">📊 Rapports</div>
            <a href="#" data-page="rapports"><i class="fas fa-chart-bar"></i> Rapports</a>
            <a href="#" data-page="profil"><i class="fas fa-user-circle"></i> Profil</a>
            <a href="#" data-page="settings"><i class="fas fa-cog"></i> Paramètres</a>
        </nav>
        <div class="sidebar-footer">
            <span id="sidebarUser" style="display:block;font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:8px;"></span>
            <button onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
    </aside>
    <main class="main-content" id="mainContent"></main>
    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
    <script src="js/router.js"></script>
</body>
</html>
