<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dagoos Mobile</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body class="splash-page">
  <div class="splash-container">
    <img src="/icons/splash-logo.png" alt="Dagoos" class="splash-logo" id="logo">
    <div class="splash-title">Dagoos</div>
    <div class="splash-subtitle">Votre transport à Madagascar</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Remplacer par le logo passager si disponible en localStorage
    const savedLogo = localStorage.getItem('dagoos_logo_pass');
    if (savedLogo) {
      document.getElementById('logo').src = savedLogo;
    }

    // Vérifier si l'API est accessible avant de rediriger
    async function checkApiAndRedirect() {
      const API_URL = window.DAGOOS_CONFIG?.apiUrl || 'https://dagoos-api.onrender.com/api';
      const MIN_SPLASH_TIME = 2500;
      const MAX_SPLASH_TIME = 8000;
      
      const startTime = Date.now();
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        await fetch(`${API_URL}/health`, { 
          signal: controller.signal,
          cache: 'no-store'
        });
        
        clearTimeout(timeoutId);
      } catch (error) {
        console.log('API inaccessible, attente...');
      }
      
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
      
      setTimeout(() => {
        window.location.replace('/index.html');
      }, Math.min(remaining, MAX_SPLASH_TIME));
    }
    
    checkApiAndRedirect();
  </script>
</body>
</html>
