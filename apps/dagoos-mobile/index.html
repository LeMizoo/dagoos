<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="/config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F59E0B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DAGOO'S">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="/b-trans.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>DAGOO'S Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1A1A2E;
      color: #FFFFFF;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      min-height: 100dvh;
    }
    .nav-bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #252540; border-top: 1px solid rgba(245,158,11,0.2);
      display: flex; justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-bottom button {
      background: none; border: none; color: #94A3B8; font-size: 11px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 12px;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-bottom button.active { color: #F59E0B; }

    /* Boutons tactiles */
    button, input, select, textarea {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button { min-height: 44px; }
    input, select { min-height: 44px; font-size: 16px; }

    /* Éviter le zoom automatique sur iOS */
    @supports (-webkit-touch-callout: none) {
      input, select, textarea { font-size: 16px !important; }
    }

    /* Scrollbar discrète */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* Media queries pour petits écrans */
    @media (max-width: 360px) {
      #app { max-width: 100%; }
      .nav-bottom button { font-size: 9px; min-height: 42px; }
      .nav-bottom button i { font-size: 16px !important; }
      button { min-height: 40px; }
      input, select { min-height: 40px; font-size: 14px; }
    }

    @media (min-width: 361px) and (max-width: 430px) {
      .nav-bottom button { font-size: 10px; }
      .nav-bottom button i { font-size: 18px !important; }
    }

    @media (min-width: 431px) {
      #app { max-width: 480px; }
    }

    /* Support orientation paysage */
    @media (orientation: landscape) and (max-height: 500px) {
      #app { max-width: 100%; padding-bottom: 60px; }
      .nav-bottom { padding: 4px 0 calc(4px + env(safe-area-inset-bottom)); }
      .nav-bottom button { min-height: 36px; }
    }
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(reg => console.log("SW enregistré !", reg))
        .catch(err => console.error("Erreur SW:", err));
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <nav class="nav-bottom" id="bottomNav">
    <button data-page="course" onclick="loadPage('course')">
      <i data-lucide="building-2" style="font-size:22px;"></i><span>Urbain</span>
    </button>
    <button data-page="home" onclick="loadPage('home')">
      <i data-lucide="home" style="font-size:22px;"></i><span>Accueil</span>
    </button>
    <button data-page="reservations" onclick="loadPage('reservations')">
      <i data-lucide="bus" style="font-size:22px;"></i><span>Interurbain</span>
    </button>

    <!-- SUIVI : visible uniquement si un code de suivi existe -->
    <button
      id="navSuivi"
      data-page="suivi"
      onclick="loadPage('suivi')"
      style="display:none;"
    >
      <i data-lucide="clipboard-list" style="font-size:22px;"></i><span>Suivi</span>
    </button>
  </nav>
  <script src="/js/router.js"></script>
  <script src="/js/api.js"></script>
  <!-- UPDATE NOTIFICATION DÉSACTIVÉE TEMPORAIREMENT
  <script src="/js/update-notification.js"></script>
  -->
  <script src="js/branding.js"></script>
  <script>
    // Afficher le bouton Suivi uniquement si un code existe
    (function() {
      function updateSuiviVisibility() {
        var btnSuivi = document.getElementById('navSuivi');
        var lastCode = localStorage.getItem('dagoos_mobile_last_code') ||
                       localStorage.getItem('dagoos_mobile_last_otp');

        if (btnSuivi) {
          btnSuivi.style.display = lastCode ? 'flex' : 'none';
        }
      }

      // Vérifier au chargement
      updateSuiviVisibility();

      // Vérifier après chaque navigation
      var originalLoadPage = window.loadPage;
      window.loadPage = function(pageName) {
        updateSuiviVisibility();
        return originalLoadPage.apply(this, arguments);
      };

      // Écouter les changements localStorage
      window.addEventListener('storage', updateSuiviVisibility);
    })();
  </script>
</body>
</html>
