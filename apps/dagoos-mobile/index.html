<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="/config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#D99A00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DAGOO'S">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="/b-trans.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>DAGOO'S Mobile</title>
<script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(reg => console.log("SW enregistré !", reg))
        .catch(err => console.error("Erreur SW:", err));
    }
  </script>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div id="app"></div>
  <nav class="nav-bottom" id="bottomNav">
    <button data-page="course" onclick="loadPage('course')">
      <i data-lucide="building-2" style="font-size:22px;"></i><span>Urbain</span>
    </button>
    <button data-page="home" onclick="loadPage('home')">
      <i data-lucide="home" style="font-size:22px;"></i><span>Accueil</span>
    </button>
    <button data-page="reservations" onclick="loadPage('reservations')">
      <i data-lucide="bus" style="font-size:22px;"></i><span>Interurbain</span>
    </button>

  </nav>
  <script src="/js/router.js"></script>
  <script src="/js/api.js"></script>
  <!-- UPDATE NOTIFICATION DÉSACTIVÉE TEMPORAIREMENT
  <script src="/js/update-notification.js"></script>
  -->
  <script src="js/escape.js"></script>
  <script src="js/branding.js"></script>
</body>
</html>
