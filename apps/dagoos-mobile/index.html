<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="/config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F59E0B">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="/b-trans.svg">
  <title>DAGOO'S Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1A1A2E;
      color: #FFFFFF;
      min-height: 100vh;
    }
    #app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
    .nav-bottom {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #252540; border-top: 1px solid rgba(245,158,11,0.2);
      display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
    }
    .nav-bottom button {
      background: none; border: none; color: #94A3B8; font-size: 11px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .nav-bottom button.active { color: #F59E0B; }
  </style>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(reg => console.log("SW enregistré !", reg))
        .catch(err => console.error("Erreur SW:", err));
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <nav class="nav-bottom" id="bottomNav">
    <button data-page="course" onclick="loadPage('course')">
      <i data-lucide="car" style="font-size:22px;"></i><span>Taxi</span>
    </button>
    <button data-page="home" onclick="loadPage('home')">
      <i data-lucide="home" style="font-size:22px;"></i><span>Accueil</span>
    </button>
    <button data-page="suivi" onclick="loadPage('suivi')">
      <i data-lucide="clipboard-list" style="font-size:22px;"></i><span>Suivi</span>
    </button>
  </nav>
  <script src="/js/router.js"></script>
  <script src="/js/api.js"></script>
</body>
</html>
