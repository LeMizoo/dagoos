<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dago Admin - Connexion</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 50%, #0F3460 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-container {
            background: white; border-radius: 20px; padding: 48px 40px;
            width: 100%; max-width: 440px; box-shadow: 0 25px 80px rgba(0,0,0,0.4);
        }
        .login-header { text-align: center; margin-bottom: 36px; }
        .login-logo { width: 72px; height: 72px; margin: 0 auto 16px; }
        .login-logo img { width: 100%; height: 100%; object-fit: contain; }
        .login-header h1 { font-size: 24px; color: #1A1A2E; margin-bottom: 4px; }
        .login-header p { color: #6C757D; font-size: 14px; }
        .badge {
            display: inline-block; background: #1A5276; color: white;
            padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 600; margin-top: 10px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #1A1A2E; margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        .input-wrapper i.left-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6C757D; }
        .input-wrapper i.toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6C757D; z-index: 2; }
        .input-wrapper i.toggle-password:hover { color: #1A5276; }
        .input-wrapper input {
            width: 100%; padding: 14px 40px 14px 44px; border: 2px solid #E9ECEF;
            border-radius: 10px; font-size: 15px; font-family: 'Inter', sans-serif; transition: 0.3s;
        }
        .input-wrapper input:focus { outline: none; border-color: #1A5276; box-shadow: 0 0 0 3px rgba(26,82,118,0.1); }
        .btn-login {
            width: 100%; padding: 14px; background: #1A5276; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; font-family: 'Inter', sans-serif;
        }
        .btn-login:hover { background: #154360; transform: translateY(-1px); }
        .btn-login:disabled { background: #6C757D; cursor: not-allowed; transform: none; }
        .message { text-align: center; margin-top: 14px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
        .message.error { background: #FDE8E8; color: #C0392B; display: block; }
        .message.success { background: #D5F5E3; color: #27AE60; display: block; }
        .message.info { background: #D6EAF8; color: #1A5276; display: block; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #6C757D; text-decoration: none; font-size: 14px; }
        .back-link a:hover { color: #1A5276; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <img src="assets/logo/b-trans.png" alt="Dago Admin">
            </div>
            <h1>Dago Admin</h1>
            <p>Plateforme d'administration</p>
            <span class="badge">🔒 Réservé aux administrateurs</span>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope left-icon"></i>
                    <input type="email" id="email" placeholder="votre@email.com" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock left-icon"></i>
                    <input type="password" id="password" placeholder="Votre mot de passe" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword" onclick="togglePassword('password','togglePassword')"></i>
                </div>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>
        </form>
        
        <div class="back-link">
            <a href="https://dago-mobility.pages.dev">← Retour à l'accueil</a>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
