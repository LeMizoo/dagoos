<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Apple PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dagoo's Driver">
    <link rel="apple-touch-icon" href="/icons/b-trans.svg">
    <title>Dagoo's Driver - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F7F8FA">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js")
                .then(reg => console.log("SW enregistré !", reg))
                .catch(err => console.error("Erreur SW:", err));
        }
    </script>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <script>
        if (!localStorage.getItem("dagoo_driver_token")) {
            window.location.replace("/");
        }
        var driverType = localStorage.getItem('dagoo_driver_type') || 'FLEET';
        if (driverType === 'COOP') {
            document.title = "Dagoo's Coop Driver";
        }
    </script>
    <main id="mainContent"></main>
    <script>
        var API_URL = DAGOOS_CONFIG.apiUrl;
        var token = localStorage.getItem('dagoo_driver_token');
        var user = JSON.parse(localStorage.getItem('dagoo_driver_user') || '{}');
        if (!token || !user.driverId) { window.location.href = '/'; }
        function apiGet(e) { return fetch(API_URL+e,{headers:{Authorization:'Bearer '+token}}).then(function(r){return r.json()}); }
    </script>
    <div class="bottom-nav">
        <button onclick="loadPage('courses')" data-page="courses"><span class="icon-circle"><i class="fas fa-history"></i></span> Courses</button>
        <button onclick="loadPage('stats')" data-page="stats"><span class="icon-circle"><i class="fas fa-chart-bar"></i></span> Stats</button>
        <button onclick="loadPage('home')" data-page="home" class="active" style="position:relative;">
            <span id="notifBadge" style="display:none;position:absolute;top:-5px;right:-5px;background:#EF4444;color:white;border-radius:50%;width:20px;height:20px;font-size:10px;align-items:center;justify-content:center;">0</span><span class="icon-circle"><i class="fas fa-home"></i></span> Accueil</button>
        <button onclick="loadPage('finances')" data-page="finances"><span class="icon-circle"><i class="fas fa-wallet"></i></span> Finances</button>
        <button onclick="loadPage('profil')" data-page="profil"><span class="icon-circle"><i class="fas fa-user"></i></span> Profil</button>
    </div>
    <script>
    </script>
    <script src="js/theme.js"></script>
    <script src="js/router.js"></script>
    <script src="js/autosave.js"></script>
    <script src="js/update-notification.js"></script>
  <script src="/js/inactivity.js"></script>
</body>
</html>
