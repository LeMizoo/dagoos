<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A1F18">
    <title>Dagoo's Driver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0A1F18 0%, #16213E 50%, #0F3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            animation: pulse 2s infinite;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.3), 0 0 80px rgba(241, 196, 15, 0.1);
            background: rgba(30, 41, 59, 0.8);
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        
        .logo-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid rgba(241, 196, 15, 0.3);
            border-radius: 35px;
            animation: rotate 3s linear infinite;
        }
        
        .logo-ring::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #F59E0B;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #F59E0B;
        }
        
        .app-name {
            font-size: 28px;
            font-weight: 800;
            color: #F59E0B;
            margin-bottom: 8px;
            letter-spacing: 1px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }
        
        .app-subtitle {
            font-size: 13px;
            color: #94A3B8;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: slideUp 0.6s ease-out 0.5s both;
        }
        
        .loader {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            animation: slideUp 0.6s ease-out 0.7s both;
        }
        
        .loader-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #F59E0B, #10B981, #F59E0B);
            border-radius: 10px;
            animation: loading 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }
        
        .version {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #475569;
            font-size: 11px;
            animation: fadeIn 1s ease-out 1s both;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Particules d'arrière-plan */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            background: rgba(241, 196, 15, 0.15);
            border-radius: 50%;
            animation: float 6s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            25% {
                opacity: 0.5;
            }
            50% {
                transform: translateY(-100px) translateX(20px);
                opacity: 0.2;
            }
            75% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="splash-container">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <img src="/icons/icon-192.png" alt="Dagoo's" class="logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect fill=%27%231A1A2E%27 width=%27100%27 height=%27100%27 rx=%2720%27/><text x=%2750%27 y=%2765%27 text-anchor=%27middle%27 font-size=%2750%27>🛵</text></svg>'">
        </div>
        
        <h1 class="app-name">Dagoo's Driver</h1>
        <p class="app-subtitle">La mobilité connectée</p>
        
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>
    
    <div class="version">v1.0.0</div>
    
    <script>
        // Générer des particules animées
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.width = (Math.random() * 6 + 2) + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
            particlesContainer.appendChild(particle);
        }
        
        // Rediriger vers l'app après le chargement
        window.addEventListener('load', function() {
            setTimeout(function() {
                window.location.href = '/dashboard';
            }, 2000);
        });
    </script>
  <script src="/js/inactivity.js"></script>
</body>
</html>
