<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dago Driver - Coopérative</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f3460;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: pulse 2s infinite;
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .splash-subtitle {
      font-size: 15px;
      opacity: 0.8;
      font-weight: 400;
    }
    .spinner {
      margin-top: 36px;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top: 4px solid #00b894;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

    <script>
    // Remplacer par le logo de la flotte si disponible en localStorage
    const savedLogo = localStorage.getItem('dagoos_logo_fleet');
    if (savedLogo) {
      document.getElementById('logo').src = savedLogo;
    }

    // Vérifier si l'API est accessible avant de rediriger
    async function checkApiAndRedirect() {
      const API_URL = window.DAGOOS_CONFIG?.apiUrl || 'https://dagoos-api.onrender.com/api';
      const MIN_SPLASH_TIME = 2500; // 2.5 secondes minimum
      const MAX_SPLASH_TIME = 8000; // 8 secondes maximum
      
      const startTime = Date.now();
      
      try {
        // Essayer de contacter l'API
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        await fetch(`${API_URL}/health`, { 
          signal: controller.signal,
          cache: 'no-store'
        });
        
        clearTimeout(timeoutId);
      } catch (error) {
        // API inaccessible, attendre un peu plus
        console.log('API inaccessible, attente...');
      }
      
      // Calculer le temps restant pour atteindre le minimum de 2.5s
      const elapsed = Date.now() - startTime;
      const remaining = Math.max(0, MIN_SPLASH_TIME - elapsed);
      
      // Rediriger après le temps restant (ou maximum)
      setTimeout(() => {
        window.location.replace('/dashboard.html');
      }, Math.min(remaining, MAX_SPLASH_TIME));
    }
    
    checkApiAndRedirect();
  </script>
